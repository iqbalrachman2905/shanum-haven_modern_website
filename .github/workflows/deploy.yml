name: Deploy Astro to GitHub Pages

on:
  # Akan trigger build setiap kali ada push ke branch main
  push:
    branches: ["main"]
  # Memungkinkan lo menjalankan workflow ini secara manual dari tab Actions
  workflow_dispatch:

# Memberikan akses yang dibutuhkan agar GitHub Actions bisa deploy ke Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Mencegah multiple deployment berjalan bersamaan
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup Pages
        uses: actions/configure-pages@v4
        
      - name: Install, build, and upload your site
        uses: withastro/action@v3
        # Action ini otomatis baca package-lock.json / pnpm-lock.yaml lo
        # dan ngejalanin `npm install` lalu `npm run build`

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4